version: '3'

# STACKIT-Operationen via stackit-cli.

tasks:
  list-firewall-rules:
    desc: 'Listet alle Security Group Rules eines Projekts. Usage: task stackit:list-firewall-rules -- <project_id> [--json]'
    cmds:
      - uv run python scripts/stackit/list_firewall_rules.py {{.CLI_ARGS}}
    preconditions:
      - sh: command -v stackit
        msg: "stackit-cli fehlt - siehe docs/REQUIREMENTS.md"
      - sh: '[ -n "$STACKIT_SERVICE_ACCOUNT_TOKEN" ]'
        msg: "STACKIT_SERVICE_ACCOUNT_TOKEN nicht gesetzt"

  list-servers:
    desc: 'Listet alle Server eines Projekts mit Status. Usage: task stackit:list-servers -- <project_id>'
    cmds:
      - bash scripts/stackit/list_servers.sh {{.CLI_ARGS}}
    preconditions:
      - sh: command -v stackit
        msg: "stackit-cli fehlt"
