name: Renovate

# Self-hosted Renovate - läuft via GitHub Actions, kein Mend-App nötig.
#
# Voraussetzung:
#   Repo-Secret RENOVATE_TOKEN setzen.
#   - Persönlicher Access Token mit Scope: repo + workflow
#     (oder GitHub-App-Token).
#   - GITHUB_TOKEN reicht NICHT, weil PRs damit kein nachgelagertes CI triggern
#     können (workflow-on-pull-request würde nicht laufen).
#
# Manueller Lauf:
#   GitHub UI -> Actions -> Renovate -> "Run workflow" (mit gewünschtem logLevel).

on:
  schedule:
    # Mo + Do, 05:00 UTC. Bewusst zweimal pro Woche, damit Sicherheits-Updates
    # nicht eine Woche liegen bleiben.
    - cron: '0 5 * * 1,4'
  push:
    branches: ["main"]
  pull_request:
    types: [closed]
    branches: ["main"]
  issues:
    types: [edited]

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options: [debug, info, warn]
      dryRun:
        description: 'Dry-run (kein PR erzeugen)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'full']

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
