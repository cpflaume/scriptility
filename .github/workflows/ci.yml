name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats jq
      - name: Install Task
        run: curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
      - run: uv sync --frozen
      - run: task dev:lint:sh
      - run: task dev:lint:py
      - run: task dev:test:bash
      - run: task dev:test:py
