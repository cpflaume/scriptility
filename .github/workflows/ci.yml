name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats jq
      - name: Install Task
        run: curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
      - run: uv sync --frozen
      - run: task dev:lint:sh
      - run: task dev:lint:py
      - run: task dev:test:bash
      - run: task dev:test:py
