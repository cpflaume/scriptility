[project]
name = "scriptility"
version = "0.1.0"
description = "DevOps script library, exposed via Taskfile"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pywinrm>=0.4",
    "ansible-core>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ansible-lint>=24",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
