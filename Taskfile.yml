version: '3'

# Root Taskfile - flacher Aufbau, ein Task pro Skript.
# Aufruf:  task <task>          z.B.  task check-port -- 10.0.0.1 443
#          task --list-all      Übersicht aller Tasks
#          task setup           Lokale Entwicklungsumgebung einrichten
#          task new -- <bash|py> <name>   Neues Skript anlegen

dotenv: ['.env']

includes:
  setup:     ./taskfiles/setup.yml
  dev:       ./taskfiles/dev.yml
  terraform: ./taskfiles/terraform.yml
  ansible:   ./taskfiles/ansible.yml

tasks:
  default:
    desc: Zeigt alle verfügbaren Tasks
    cmds:
      - task --list-all
    silent: true

  doctor:
    desc: Prüft, ob alle benötigten CLI-Tools installiert sind
    cmds:
      - bash scripts/lib/doctor.sh

  new:
    desc: 'Generiert neues Skript inkl. Test+Task. Usage: task new -- <bash|py> <name>'
    cmds:
      - bash scripts/lib/new_script.sh {{.CLI_ARGS}}

  # >>> AUTO-GENERATED SCRIPTS — managed by `task new` / `task dev:sync-tasks`. Do not edit by hand. >>>
  check-port:
    desc: 'TCP-Erreichbarkeit prüfen. Usage: task check-port -- <host> <port> [timeout]'
    cmds: ['bash scripts/check_port.sh {{.CLI_ARGS}}']

  check-port-py:
    desc: 'Python-Variante mit JSON-Output. Usage: task check-port-py -- --host h --port p [--json]'
    cmds: ['uv run python scripts/check_port.py {{.CLI_ARGS}}']

  check-stackit-port:
    desc: 'Prüft, ob ein Port per STACKIT-Security-Group freigeschaltet ist. Usage: task check-stackit-port -- --project-id <id> --port <p> [--protocol tcp] [--json]'
    cmds: ['uv run python scripts/check_stackit_port.py {{.CLI_ARGS}}']

  cron-overview:
    desc: 'Sammelt alle Cronjobs (system + per-user). Usage: task cron-overview -- <host>'
    cmds: ['bash scripts/cron_overview.sh {{.CLI_ARGS}}']

  list-gitlab-projects:
    desc: 'Listet alle Projekte einer GitLab-Group. Usage: task list-gitlab-projects -- <group_id>'
    cmds: ['uv run python scripts/list_gitlab_projects.py {{.CLI_ARGS}}']

  list-gitlab-schedules:
    desc: 'Listet Pipeline-Schedules in einer Group (rekursiv). Usage: task list-gitlab-schedules -- <group_id>'
    cmds: ['uv run python scripts/list_gitlab_schedules.py {{.CLI_ARGS}}']

  list-linux-firewall:
    desc: 'Zeigt iptables/nftables-Regeln. Usage: task list-linux-firewall -- <host>'
    cmds: ['bash scripts/list_linux_firewall.sh {{.CLI_ARGS}}']

  list-linux-users:
    desc: 'Listet lokale Benutzer eines Linux-Hosts. Usage: task list-linux-users -- <host>'
    cmds: ['bash scripts/list_linux_users.sh {{.CLI_ARGS}}']

  list-stackit-all-servers:
    desc: 'Server über alle STACKIT-Projekte als CSV (OS/Image, Flavor, IPs, State). Usage: task list-stackit-all-servers -- [--json]'
    cmds: ['uv run python scripts/list_stackit_all_servers.py {{.CLI_ARGS}}']

  list-stackit-firewall-rules:
    desc: 'Listet Security-Group-Regeln eines STACKIT-Projekts. Usage: task list-stackit-firewall-rules -- <project_id> [--json]'
    cmds: ['uv run python scripts/list_stackit_firewall_rules.py {{.CLI_ARGS}}']

  list-stackit-servers:
    desc: 'Server eines STACKIT-Projekts inkl. OS/Image, Flavor (vCPU/RAM), IPs & State. Usage: task list-stackit-servers -- <project_id> [--json]'
    cmds: ['uv run python scripts/list_stackit_servers.py {{.CLI_ARGS}}']

  list-windows-services:
    desc: 'Listet alle laufenden Windows-Services. Usage: task list-windows-services -- --host <host> [--json]'
    cmds: ['uv run python scripts/list_windows_services.py {{.CLI_ARGS}}']

  list-windows-users:
    desc: 'Listet lokale Windows-Benutzer. Usage: task list-windows-users -- --host <host> [--json]'
    cmds: ['uv run python scripts/list_windows_users.py {{.CLI_ARGS}}']

  resolve:
    desc: 'DNS-Auflösung mit allen Records. Usage: task resolve -- <hostname>'
    cmds: ['bash scripts/resolve.sh {{.CLI_ARGS}}']

  windows-scheduled-tasks:
    desc: 'Listet Windows Scheduled Tasks. Usage: task windows-scheduled-tasks -- --host <host> [--json]'
    cmds: ['uv run python scripts/windows_scheduled_tasks.py {{.CLI_ARGS}}']
  ad-app-onboarding:
    desc: 'Liest AD-Onboarding-Voraussetzungen (Konto/SPNs/Hostnamen/Gruppen). Usage: task ad-app-onboarding -- --host <adhost> --account <sam> [--group NAME ...] [--group-filter <pat>] [--spec <datei.json>] [--json]'
    cmds: ['uv run python scripts/ad_app_onboarding.py {{.CLI_ARGS}}']
  # <<< END AUTO-GENERATED <<<
